<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fretboard Practice</title>
  <meta name="description" content="Memorise the guitar neck by ear: the app names a string and a note, you play it, the microphone confirms it.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a class="top__back" href="../index.html" aria-label="Back to Fretboard Explorer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span>Explorer</span>
    </a>
    <h1 class="top__title">Fretboard Practice</h1>
    <button class="icon-btn" id="settings-open" aria-label="Open settings" aria-controls="settings" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="6" r="2" fill="var(--bg)"/><circle cx="15" cy="12" r="2" fill="var(--bg)"/><circle cx="7" cy="18" r="2" fill="var(--bg)"/></svg>
    </button>
  </header>

  <main class="stage">
    <section class="prompt" aria-live="polite">
      <div class="prompt__string" id="string-name">Press start</div>
      <div class="prompt__note" id="note-name" data-state="idle"></div>
      <div class="prompt__status" id="status">Pick a string, play the note it names, and the mic will confirm it.</div>
    </section>

    <section class="board">
      <div class="board__scroll" id="board-scroll">
        <svg class="fretboard" id="fretboard"></svg>
      </div>
    </section>

    <section class="controls">
      <div class="controls__left">
        <div class="meter" title="Microphone level">
          <svg class="meter__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
          <div class="meter__track"><div class="meter__fill" id="meter-fill"></div><div class="meter__gate" id="meter-gate"></div></div>
        </div>
        <div class="mic-note" id="mic-note" hidden></div>
      </div>

      <div class="controls__center">
        <button class="btn btn--ghost" id="hint-btn" disabled>Hint <kbd>H</kbd></button>
        <button class="btn btn--primary" id="start-btn">Start <kbd>Space</kbd></button>
        <button class="btn btn--ghost" id="skip-btn" disabled>Skip <kbd>N</kbd></button>
      </div>

      <div class="controls__right">
        <div class="ring" id="ring" title="Time until the hint appears">
          <svg viewBox="0 0 44 44" width="44" height="44">
            <circle class="ring__track" cx="22" cy="22" r="18"/>
            <circle class="ring__fill" id="ring-fill" cx="22" cy="22" r="18"/>
          </svg>
          <span class="ring__label" id="ring-label">5s</span>
        </div>
      </div>
    </section>

    <section class="stats" id="stats">
      <div class="stat"><span class="stat__value" id="stat-count">0</span><span class="stat__label">notes</span></div>
      <div class="stat"><span class="stat__value" id="stat-accuracy">—</span><span class="stat__label">first try</span></div>
      <div class="stat"><span class="stat__value" id="stat-avg">—</span><span class="stat__label">avg time</span></div>
      <div class="stat"><span class="stat__value" id="stat-wrong">0</span><span class="stat__label">wrong notes</span></div>
    </section>
  </main>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="settings" id="settings" aria-label="Settings" hidden>
    <div class="settings__head">
      <h2>Settings</h2>
      <button class="icon-btn" id="settings-close" aria-label="Close settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="settings__body">
      <fieldset class="group">
        <legend>Strings</legend>
        <div class="pills" id="string-pills"></div>
      </fieldset>

      <fieldset class="group">
        <legend>Frets</legend>
        <div class="row">
          <label class="field"><span>From</span><input type="number" id="fret-from" min="0" max="21" inputmode="numeric"></label>
          <label class="field"><span>To</span><input type="number" id="fret-to" min="0" max="21" inputmode="numeric"></label>
        </div>
        <div class="row row--presets" id="fret-presets">
          <button type="button" class="chip" data-from="0" data-to="4">0–4</button>
          <button type="button" class="chip" data-from="0" data-to="11">0–11</button>
          <button type="button" class="chip" data-from="5" data-to="11">5–11</button>
          <button type="button" class="chip" data-from="12" data-to="21">12+</button>
          <button type="button" class="chip" data-from="0" data-to="21">All</button>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>Notes</legend>
        <div class="segmented" role="radiogroup" aria-label="Note set">
          <label><input type="radio" name="noteset" value="naturals"><span>Naturals only</span></label>
          <label><input type="radio" name="noteset" value="chromatic"><span>With sharps</span></label>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>Hint</legend>
        <label class="slider">
          <span class="slider__head"><span>Show the answer after</span><output id="hint-out">5 s</output></span>
          <input type="range" id="hint-delay" min="0" max="16" step="1">
          <span class="slider__hint">Drag to the far right for never.</span>
        </label>
        <label class="slider">
          <span class="slider__head"><span>Pause after a correct note</span><output id="pause-out">0.9 s</output></span>
          <input type="range" id="pause" min="300" max="3000" step="100">
        </label>
      </fieldset>

      <fieldset class="group">
        <legend>Voice</legend>
        <label class="switch"><input type="checkbox" id="voice-on"><span>Say the string and note</span></label>
        <label class="switch"><input type="checkbox" id="voice-feedback"><span>Say "correct" / "that was …"</span></label>
        <label class="field field--full"><span>Voice</span><select id="voice-select"></select></label>
        <label class="slider">
          <span class="slider__head"><span>Speed</span><output id="rate-out">1.0×</output></span>
          <input type="range" id="voice-rate" min="0.6" max="1.6" step="0.1">
        </label>
        <button type="button" class="btn btn--ghost btn--small" id="voice-test">Test voice</button>
      </fieldset>

      <fieldset class="group">
        <legend>Microphone</legend>
        <label class="slider">
          <span class="slider__head"><span>Gate <small>ignore sound below</small></span><output id="gate-out"></output></span>
          <input type="range" id="gate" min="1" max="60" step="1">
        </label>
        <label class="slider">
          <span class="slider__head"><span>Clarity <small>how sure before accepting</small></span><output id="clarity-out"></output></span>
          <input type="range" id="clarity" min="0.5" max="0.99" step="0.01">
        </label>
        <label class="slider">
          <span class="slider__head"><span>Gain</span><output id="gain-out"></output></span>
          <input type="range" id="gain" min="0.5" max="5" step="0.1">
        </label>
      </fieldset>

      <button type="button" class="btn btn--ghost btn--small" id="settings-reset">Reset to defaults</button>
    </div>
  </aside>

  <footer class="foot">
    <span><kbd>Space</kbd> start / stop</span>
    <span><kbd>N</kbd> skip</span>
    <span><kbd>H</kbd> hint now</span>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
