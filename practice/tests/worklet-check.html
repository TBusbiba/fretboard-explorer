<!doctype html><meta charset="utf-8"><title>worklet check</title>
<script type="module">
import { createTracker } from '../js/vibrato/tracker.js';
// Synthesized guitar-ish note with a 5.3 Hz, 100-cent vibrato fed in as the "microphone".
navigator.mediaDevices.getUserMedia = async () => {
  const c = new AudioContext();
  const dest = c.createMediaStreamDestination();
  const osc = c.createOscillator();
  osc.setPeriodicWave(c.createPeriodicWave(new Float32Array([0, 1, 0.5, 0.25]), new Float32Array(4)));
  osc.frequency.value = 329.63;  // E4
  const lfo = c.createOscillator(); lfo.frequency.value = 5.3;
  const lfoGain = c.createGain(); lfoGain.gain.value = 50;        // ±50 cents around +50 => 0..100
  const offset = c.createConstantSource(); offset.offset.value = 50;
  lfo.connect(lfoGain).connect(osc.detune); offset.connect(osc.detune);
  const g = c.createGain(); g.gain.value = 0.3;
  osc.connect(g).connect(dest); osc.start(); lfo.start(); offset.start();
  return dest.stream;
};
const frames = [];
const tr = createTracker({ onFrame: f => frames.push(f), onState: (s, d) => { window.__state = s; if (d) window.__err = String(d && d.message || d); } });
await tr.start();
await new Promise(r => setTimeout(r, 2500));
const good = frames.filter(f => f.midi != null && f.t > 0.5);
const cents = good.map(f => (f.midi - 64) * 100);
const dts = []; for (let i = 1; i < good.length; i++) dts.push(good[i].t - good[i - 1].t);
const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
// rate via upward crossings of the midpoint
let cross = 0; for (let i = 1; i < cents.length; i++) if (cents[i - 1] < 50 && cents[i] >= 50) cross++;
const span = good[good.length - 1].t - good[0].t;
window.__result = {
  state: tr.state, frames: frames.length, valid: good.length, hopMs: +(mean(dts) * 1000).toFixed(2),
  minCents: +Math.min(...cents).toFixed(1), maxCents: +Math.max(...cents).toFixed(1), rateHz: +(cross / span).toFixed(2),
  err: window.__err || null,
};
</script>
